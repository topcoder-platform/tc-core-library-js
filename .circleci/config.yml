version: 2.1
jobs:
  test:
    docker:
      - image: cimg/node:22.23
    steps:
      - checkout
      - run: corepack enable
      - run: corepack prepare pnpm@11.28.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
workflows:
  keycloak-validation:
    jobs:
      - test
# No publish or deployment job on the migration branch. Release is explicit.
